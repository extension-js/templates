name: Optional Deps Consumer Contract

on:
  pull_request:
    paths:
      - 'examples/**'
      - 'scripts/install-contracts/assert-optional-deps-canary-matrix.mjs'
      - 'scripts/install-contracts/assert-canary-one-run-builds.mjs'
      - 'scripts/install-contracts/assert-stable-install-modes.mjs'
      - 'scripts/install-contracts/assert-stable-pnpm-postcss-repro.mjs'
      - '.github/workflows/optional-deps-ecosystem.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths:
      - 'examples/**'
      - 'scripts/install-contracts/assert-optional-deps-canary-matrix.mjs'
      - 'scripts/install-contracts/assert-canary-one-run-builds.mjs'
      - 'scripts/install-contracts/assert-stable-install-modes.mjs'
      - 'scripts/install-contracts/assert-stable-pnpm-postcss-repro.mjs'
      - '.github/workflows/optional-deps-ecosystem.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: optional-deps-ecosystem-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versioned-ecosystem:
    name: ecosystem matrix (${{ matrix.os }} / ${{ matrix.pm }})
    runs-on: ${{ matrix.os }}
    # The slowest lane takes 3 minutes. A registry fault once left seven
    # of them spinning, and a job with no limit holds its runner for 6 hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            pm: pnpm
          - os: ubuntu-24.04
            pm: npm
          - os: ubuntu-24.04
            pm: yarn
          - os: ubuntu-24.04
            pm: bun
          - os: macos-latest
            pm: pnpm
          - os: windows-latest
            pm: pnpm

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable corepack for Yarn
        if: matrix.pm == 'yarn'
        run: corepack enable

      - name: Setup Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Run optional deps ecosystem checks
        run: node scripts/install-contracts/assert-optional-deps-canary-matrix.mjs --pm ${{ matrix.pm }}

  # Examples CI runs these same guards on every pull request and every push
  # to main, so here they run only where it does not: the daily schedule.
  first-run-repros:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: first-run reproducibility guards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert one-run builds
        run: pnpm run test:canary-one-run

      # The pnpm install modes run in the install vs exec (pnpm) job below.
      - name: Assert stable pnpm PostCSS repro
        run: pnpm run test:stable-pnpm-postcss-repro

  install-vs-exec-matrix:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    name: install vs exec (${{ matrix.pm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pm: npm
          - pm: pnpm
          - pm: yarn
          - pm: bun
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable corepack for Yarn
        if: matrix.pm == 'yarn'
        run: corepack enable

      - name: Setup Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert install and exec modes
        run: pnpm run test:stable-install-modes -- --pm ${{ matrix.pm }}
