# ███████╗██╔╝ ██╗██║  ██║██║ ╚═╝ ██║██║     ███████╗███████╗███████║
# ╚══════╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝     ╚═╝╚═╝     ╚══════╝╚══════╝╚══════╝

name: Publish artifacts

on:
  workflow_run:
    workflows: ["Examples CI"]
    types:
      - completed
    branches: [ main ]
  # A failing test lane skips the run above, which silently freezes the
  # committed catalog the website serves. This nightly pass refreshes it from
  # main regardless, so a flaky test costs a day of staleness, never weeks.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-and-commit:
    # Prevent loops on bot commits and only run if CI succeeded (or manual
    # dispatch, or the nightly refresh that does not depend on the test lane)
    if: |
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The push below goes out with this key, which the main ruleset
          # lets through. The Actions token cannot bypass a required check.
          ssh-key: ${{ secrets.ARTIFACTS_DEPLOY_KEY }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            examples/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install

      # No template is built or zipped here: nothing read those files, and the
      # catalog below is generated from the source tree alone.
      - name: Generate metadata
        run: pnpm run generate:raw

      - name: Stage templates metadata
        run: node scripts/catalog/publish-artifacts.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates-meta.json
          # A run that moved only the timestamp has nothing to say on main.
          if ! git diff --staged --quiet -I '"generatedAt"'; then
            git commit -m "chore: update artifacts [skip ci]"
            git push
          fi
